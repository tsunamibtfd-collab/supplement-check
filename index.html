<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplement Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clinical, honest; evidence before hype
   IDEA: a supplement-facts label: heavy rules, plain rows, nothing hidden
   PICTURE: the questionnaire itself, then results printed as facts panels
   COLOUR and TYPE: white ground, cobalt field, coral for cautions; Archivo 900 labels + Inter body
   LAYOUT: one calm column, progress rail on top, results as a grid of panels */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1020);--ink:light-dark(#0d1530,#eef1fb);--mute:light-dark(#4c5675,#a8b0cc);
--field:light-dark(#1f4fd8,#16307e);--onfield:#ffffff;--soft:light-dark(#eef2ff,#141c38);--line:light-dark(#0d1530,#dfe5f7);
--hair:light-dark(#d5dbec,#2a3458);--warn:light-dark(#c2361a,#ff8a6e);--warnbg:light-dark(#fff1ec,#2b1612);--ok:light-dark(#1f4fd8,#8fb0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.lab{font-family:Archivo,Inter,sans-serif}
.top{background:var(--field);color:var(--onfield);padding:clamp(22px,4vw,44px) max(5vw,16px) 26px}
.top h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.05;font-weight:900;text-wrap:balance;max-width:20ch}
.top p{margin:10px 0 0;max-width:62ch;opacity:.9}
.rail{display:flex;gap:6px;margin-top:22px}.rail i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}.rail i.on{background:#fff}
main{max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,48px) max(5vw,16px) 64px}
.q{max-width:720px}
.q h2{font-size:clamp(26px,3.6vw,34px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.q .sub{color:var(--mute);margin:0 0 18px}
.fld{margin:22px 0 0}.fld>.lab{display:block;font-weight:700;font-size:17px;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:16px;min-height:44px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--ok)}
.opt[aria-pressed=true]{background:var(--field);border-color:var(--field);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.num{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num input{font:inherit;font-size:16px;width:130px;min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--hair);background:var(--bg);color:var(--ink)}
.nav{display:flex;gap:10px;margin-top:34px;align-items:center;flex-wrap:wrap}
.btn{font:600 16px Inter,sans-serif;min-height:46px;padding:10px 22px;border-radius:10px;border:0;background:var(--field);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--hair)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.err{color:var(--warn);font-weight:600}
.note{font-size:14px;color:var(--mute);margin-top:26px;max-width:70ch}
.alert{border-left:6px solid var(--warn);background:var(--warnbg);padding:16px 18px;border-radius:0 12px 12px 0;margin:0 0 22px;max-width:860px}
.alert strong{display:block;font-family:Archivo,sans-serif;font-size:18px;margin-bottom:4px}
.info{border-left:6px solid var(--ok);background:var(--soft);padding:16px 18px;border-radius:0 12px 12px 0;margin:0 0 22px;max-width:860px}
.rh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.rh h2{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance;max-width:22ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
.panel{border:2px solid var(--line);padding:14px 16px 16px;background:var(--bg)}
.panel h3{margin:0;font-size:26px;font-weight:900;line-height:1.1}
.panel .kind{font-size:14px;color:var(--mute);margin:2px 0 8px}
.rule{height:8px;background:var(--line);margin:8px -2px}.thin{height:1px;background:var(--line);margin:6px 0}
.row{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:15px}
.row:last-child{border-bottom:0}.row .lab{font-weight:700}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}.pips b{width:14px;height:14px;border:2px solid var(--ok);border-radius:3px}.pips b.f{background:var(--ok)}
.flag{color:var(--warn);font-weight:600}
.panel.out{opacity:.85;border-style:dashed}
.sec{margin-top:44px}.sec h2{font-size:26px;margin:0 0 12px}
.found{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;padding:0;margin:0;list-style:none}
.found li{background:var(--soft);padding:14px 16px;border-radius:12px}.found b{display:block;font-family:Archivo,sans-serif}
.skip{padding-left:20px}.skip li{margin:6px 0}
@media(max-width:600px){.row{grid-template-columns:1fr;gap:0}.panel h3{font-size:23px}}
@media(prefers-reduced-motion:no-preference){.q,.res{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

  if(o&&o.dataset.unit){A.unit=o.dataset.unit;save();return render()}
  if(o){const f=steps[step].f.find(x=>x.id===o.dataset.f),v=o.dataset.v;
    if(f.type==='multi'){const arr=A[f.id]||(A[f.id]=[]);const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);
      if(f.id==='acts'){if(v==='none'&&i<0)A.acts=['none'];else if(v!=='none')A.acts=A.acts.filter(x=>x!=='none')}}
    else A[f.id]=A[f.id]===v?undefined:v;
    save();return render()}
  if(e.target.id==='next'){const miss=steps[step].f.find(f=>f.req&&(f.type==='multi'?!(A[f.id]||[]).length:!A[f.id]));
    if(miss){document.getElementById('err').textContent='Please answer this one to continue.';return}
    step++;save();render();window.scrollTo({top:0})}
  if(e.target.id==='back'){step--;render()}
  if(e.target.id==='restart'){A={goals:[],acts:[],cond:[],meds:[],unit:'kg'};step=0;save();render()}
  if(e.target.id==='edit'){step=0;render()}
  if(e.target.id==='send'){send(e.target)}
  if(e.target.id==='copy'){navigator.clipboard.writeText(summary()).then(()=>e.target.textContent='Copied',()=>e.target.textContent='Copy failed: select the text instead')}
});
app.addEventListener('input',e=>{if(e.target.id==='w'){A.w=e.target.value;save()}});

let picked=[],left=[];
function score(){
  picked=[];left=[];
  for(const s of S){
    let sc=0;(A.goals||[]).forEach(g=>sc+=s.g[g]||0);
    const fit=sc>0;(A.acts||[]).forEach(a=>sc+=s.a[a]||0);
    const b=s.boost?s.boost():0;sc+=b;
    if(!fit&&b<=0)continue;
    sc+=s.gr;const c=s.chk();const w=[...c.w];
    if(A.preg==='y'&&!c.out)w.unshift('Pregnant or breastfeeding: check with your clinician before starting.');
    if(has('meds','other')&&!c.out)w.push('Ask your pharmacist to check it against your other prescriptions.');
    (c.out?left:picked).push({s,sc,w,out:c.out});
  }
  picked.sort((a,b)=>b.sc-a.sc);
}
const pips=g=>`<span class="pips" aria-hidden="true">${[1,2,3].map(i=>`<b class="${i<=g?'f':''}"></b>`).join('')}</span>`;
function panel(p){return`<article class="panel ${p.out?'out':''}"><h3>${p.s.n}</h3><div class="kind">${p.s.k}</div><div class="rule"></div>
 <div class="row"><span class="lab">Evidence</span><span>${pips(p.s.gr)}${GR[p.s.gr]}</span></div>
 ${p.out?`<div class="row"><span class="lab">Left out</span><span class="flag">${p.out}</span></div>`:`
 <div class="row"><span class="lab">What it does</span><span>${p.s.why}</span></div>
 <div class="row"><span class="lab">Studied amount</span><span>${p.s.dose()}</span></div>
 ${p.w.length?`<div class="row"><span class="lab">Check first</span><span class="flag">${p.w.join(' ')}</span></div>`:''}`}</article>`}
function foundations(){const f=[];
 f.push(['Sleep',A.sleepq==='poor'?'Poor sleep blunts every supplement here. A fixed wake time and a dark, cool room come first.':'7–9 hours keeps recovery, mood and focus on track.']);
 f.push(['Protein from food',A.prot==='y'?'You already spread protein across meals. Keep it up.':'Add a protein source to each meal before buying powder.']);
 f.push(['Move most days','150 minutes a week of moderate activity plus two strength sessions is the base guideline for adults.']);
 if(has('goals','mood')||has('goals','stress'))f.push(['Daylight and people','Morning daylight, time outdoors and regular contact with others have stronger evidence for mood than any capsule.']);
 if(A.long==='l')f.push(['Fuel long sessions','Carbohydrate during sessions over 90 minutes beats any supplement for endurance.']);
 return f}
function summary(){score();return['Supplement Check summary (educational, not medical advice)','Goals: '+(A.goals||[]).join(', '),'Conditions: '+((A.cond||[]).join(', ')||'none'),'Medicines: '+((A.meds||[]).join(', ')||'none'),'Pregnant/breastfeeding: '+(A.preg||'not answered'),'',
 'Options to discuss:',...picked.map(p=>`- ${p.s.n} (${GR[p.s.gr]} evidence): ${p.s.dose()}${p.w.length?' Notes: '+p.w.join(' '):''}`),'','Left out for safety:',...(left.length?left.map(p=>`- ${p.s.n}: ${p.out}`):['- none'])].join('\n')}
function send(btn){
  const msg=document.getElementById('sendmsg');btn.disabled=true;msg.textContent='Sending…';
  const {unit,...ans}=A;
  fetch(SUPA_URL.replace(/\/$/,'')+'/rest/v1/responses',{method:'POST',
    headers:Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},SUPA_KEY.startsWith('eyJ')?{'Authorization':'Bearer '+SUPA_KEY}:{}),
    body:JSON.stringify({answers:{...ans,w_kg:Math.round(kg())||null,w:undefined},results:{picked:picked.map(p=>p.s.id),left:left.map(p=>p.s.id)}})})
  .then(r=>{if(!r.ok)throw 0;msg.textContent='Thank you. Your answers were sent.';btn.textContent='Sent'})
  .catch(()=>{msg.textContent='Could not send right now. Please try again later.';btn.disabled=false});
}
function results(){
  score();const minor=A.age==='u18';const low=+A.low||0;
  const top=picked.slice(0,6),more=picked.slice(6);
  app.innerHTML=`<section class="res">
  ${low>=2?`<div class="alert"><strong>Your mood answers matter more than any supplement</strong>Feeling down most days for two weeks is worth talking to a doctor about; effective help exists. If you ever feel unsafe or think about ending your life, call or text 988 in Canada or the US, or your local emergency number.</div>`:''}
  ${A.tested==='y'?`<div class="info"><strong>Drug-tested athlete:</strong> use only batch-tested products (NSF Certified for Sport or Informed Sport). Even then, risk is never zero; you remain responsible for what you take.</div>`:''}
  <div class="rh"><h2>${minor?'For under-18s, food and training come first':top.length?`${top.length} options worth discussing, best evidence first`:'Nothing stood out for your goals'}</h2>
  <div class="nav" style="margin:0"><button class="btn ghost" id="edit">Change answers</button><button class="btn ghost" id="restart">Start over</button></div></div>
  ${minor?`<div class="info">Sports bodies advise against performance supplements for young athletes, apart from medically indicated ones such as iron or vitamin D after a blood test. Talk to a doctor or sports dietitian, and use the foundations below.</div>`:`
  <div class="grid">${top.map(panel).join('')}</div>
  ${more.length?`<div class="sec"><h2>Also relevant, lower priority</h2><div class="grid">${more.map(panel).join('')}</div></div>`:''}
  ${left.length?`<div class="sec"><h2>Left out for your safety</h2><div class="grid">${left.map(panel).join('')}</div></div>`:''}`}
  <div class="sec"><h2>Foundations that work better</h2><ul class="found">${foundations().map(([t,d])=>`<li><b>${t}</b>${d}</li>`).join('')}</ul></div>
  <div class="sec"><h2>Usually not worth the money</h2><ul class="skip"><li><b>BCAAs</b> if you already eat enough protein.</li><li><b>Glutamine</b> for performance or muscle gain.</li><li><b>“Testosterone boosters”</b> and <b>fat burners</b>: little evidence, frequent contamination.</li><li><b>Proprietary blends</b> that hide the amount of each ingredient.</li></ul></div>
  ${SUPA_URL&&SUPA_KEY?`<div class="sec"><h2>Help improve this app</h2><p>Send your answers anonymously to the app's creator. No name, email or contact details are included. This is optional.</p><button class="btn" id="send">Send my answers anonymously</button> <span id="sendmsg" class="note"></span></div>`:''}
  ${minor?'':`<div class="sec"><h2>Take this to your doctor or pharmacist</h2><p>A plain-text summary of your answers and the options above.</p><button class="btn" id="copy">Copy summary</button></div>`}
  <p class="note">Evidence grades draw on the IOC 2018 consensus on dietary supplements, the Australian Institute of Sport framework and ISSN position stands. Amounts are those used in research on healthy adults, not prescriptions. This prototype is educational and is not medical advice.</p></section>`;
}
render();
}
</script>
